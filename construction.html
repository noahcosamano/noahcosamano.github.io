<!DOCTYPE html>

<body class="construction-page">
    <div class="maintenance-box">
        <div class="status-header">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h2>SYSTEM STATUS: RESTRICTED</h2>
        </div>
        
        <div class="terminal-window">
            <p class="command">> Initializing construction protocol...</p>
            <p class="command">> Deploying security patches...</p>
            <p class="command">> Status: <span class="highlight">In Progress</span></p>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>

        <p class="description">
            This sector is currently undergoing scheduled maintenance and security hardening. 
            Estimated time of completion: <strong>Q3 2026</strong>.
        </p>

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Return to Secure Perimeter
        </a>
    </div>

</html>
